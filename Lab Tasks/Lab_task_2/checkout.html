<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Maharishi Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="checkout-container">
        <div class="checkout-header">
            <h1>Checkout</h1>
            <p>Please fill in your details to complete your purchase</p>
        </div>
        
        <form id="checkoutForm" class="checkout-form">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" required 
                       pattern="[A-Za-z\s]+" title="Only alphabets and spaces allowed"
                       class="form-control" placeholder="Enter your full name">
                <span class="error" id="fullNameError"></span>
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required 
                       class="form-control" placeholder="Enter your email">
                <span class="error" id="emailError"></span>
            </div>
            
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required 
                       pattern="[0-9]{10,15}" title="10-15 digits required"
                       class="form-control" placeholder="Enter your phone number">
                <span class="error" id="phoneError"></span>
            </div>
            
            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" name="address" required 
                          class="form-control" placeholder="Enter your full address"></textarea>
                <span class="error" id="addressError"></span>
            </div>
            
            <div class="form-group">
                <label for="cardNumber">Credit Card Number</label>
                <input type="text" id="cardNumber" name="cardNumber" required 
                       pattern="[0-9]{16}" title="16 digits required"
                       maxlength="16" class="form-control" 
                       placeholder="Enter 16-digit card number">
                <span class="error" id="cardNumberError"></span>
            </div>
            
            <div class="form-group">
                <label for="expiryDate">Expiry Date</label>
                <input type="month" id="expiryDate" name="expiryDate" required 
                       class="form-control">
                <span class="error" id="expiryDateError"></span>
            </div>
            
            <div class="form-group">
                <label for="cvv">CVV</label>
                <input type="text" id="cvv" name="cvv" required 
                       pattern="[0-9]{3}" title="3 digits required"
                       maxlength="3" class="form-control" 
                       placeholder="Enter 3-digit CVV">
                <span class="error" id="cvvError"></span>
            </div>
            
            <button type="submit" class="submit-btn">SUBMIT ORDER</button>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function() {
            // Prevent non-numeric input for phone, card number, and CVV
            $('#phone, #cardNumber, #cvv').on('input', function() {
                this.value = this.value.replace(/[^0-9]/g, '');
            });

            // Prevent non-alphabetic input for full name
            $('#fullName').on('input', function() {
                this.value = this.value.replace(/[^A-Za-z\s]/g, '');
            });

            $('#checkoutForm').on('submit', function(e) {
                e.preventDefault();
                let isValid = true;
                
                // Reset errors and remove error class
                $('.error').text('');
                $('input, textarea').removeClass('error-input');
                
                // Full Name validation
                const fullName = $('#fullName')[0];
                if (!fullName.checkValidity()) {
                    $('#fullNameError').text('Please enter a valid name (only alphabets and spaces allowed)');
                    $('#fullName').addClass('error-input');
                    isValid = false;
                }

                // Email validation
                const email = $('#email')[0];
                if (!email.checkValidity()) {
                    $('#emailError').text('Please enter a valid email address');
                    $('#email').addClass('error-input');
                    isValid = false;
                }

                // Phone validation
                const phone = $('#phone')[0];
                if (!phone.checkValidity()) {
                    $('#phoneError').text('Please enter a valid phone number (10-15 digits)');
                    $('#phone').addClass('error-input');
                    isValid = false;
                }

                // Address validation
                const address = $('#address')[0];
                if (!address.checkValidity()) {
                    $('#addressError').text('Address is required');
                    $('#address').addClass('error-input');
                    isValid = false;
                }

                // Card Number validation
                const cardNumber = $('#cardNumber')[0];
                if (!cardNumber.checkValidity()) {
                    $('#cardNumberError').text('Please enter a valid 16-digit card number');
                    $('#cardNumber').addClass('error-input');
                    isValid = false;
                }

                // Expiry Date validation
                const expiryDate = $('#expiryDate')[0];
                if (!expiryDate.checkValidity()) {
                    $('#expiryDateError').text('Expiry date is required');
                    $('#expiryDate').addClass('error-input');
                    isValid = false;
                } else {
                    const [year, month] = expiryDate.value.split('-');
                    const expiry = new Date(year, month - 1);
                    const today = new Date();
                    if (expiry < today) {
                        $('#expiryDateError').text('Card has expired');
                        $('#expiryDate').addClass('error-input');
                        isValid = false;
                    }
                }

                // CVV validation
                const cvv = $('#cvv')[0];
                if (!cvv.checkValidity()) {
                    $('#cvvError').text('Please enter a valid 3-digit CVV');
                    $('#cvv').addClass('error-input');
                    isValid = false;
                }
                
                if (isValid) {
                    alert('Order submitted successfully!');
                    $('#checkoutForm')[0].reset();
                }
                
                return false;
            });
        });
    </script>
</body>
</html>
